# H713 / HY200: Verhalten der Einschalttaste (PL4, gpio-keys, KEY_POWER).
#
# NICHT installiert. Ziel waere /etc/systemd/logind.conf.d/10-h713-power-key.conf
# im Netboot-Rootfs (/srv/h713-rootfs). Diese Datei liegt nur als Vorschlag im
# Paketordner (analyse/boot/arbeit/g3-kernel/systemd/).
#
# Stand 2026-09-08: /srv/h713-rootfs/etc/systemd/logind.conf ist unveraendert
# (alle Zeilen auskommentiert), es gibt kein logind.conf.d/. Damit gilt schon
# heute HandlePowerKey=poweroff -- die Datei macht das nur ausdruecklich und
# ist der Ort, an dem das Gate (G1/G2) spaeter ein anderes Verhalten setzt.

[Login]
# Kurzer Druck: sauber herunterfahren. Achtung: das Geraet hat kein echtes Aus
# (kein PMIC, TF-A sunxi_power_down() kehrt zurueck) -- Linux haelt an, Panel
# und Luefter bleiben an, bis das U-Boot-Gate (GP5) den Neustart abfaengt.
HandlePowerKey=poweroff

# Langer Druck: gleiches Ziel, damit ein festgehaltener Knopf nie ins Leere
# laeuft (Vorgabe waere hier "ignore").
HandlePowerKeyLongPress=poweroff

# Erst einschalten, wenn ein Dienst (z. B. hy310-tv) Inhibitor-Sperren nimmt
# und die Taste dadurch wirkungslos wird:
#PowerKeyIgnoreInhibited=yes

# aic8800_fdrv talks far too much as delivered: aicwf_dbg_level is 0x40F from
# the factory (ERROR|INFO|DEBUG|TRACE|FW) and under load floods the serial
# console with rwnx_send_msg/rwnx_fill_station_info lines (cstenger's finding,
# mainline/tools/rootfs/customize.sh). Errors only. It stays a run-time knob:
#   echo 0x403 > /sys/module/aic8800_fdrv/parameters/aicwf_dbg_level
# also brings the firmware messages into the kernel log (journalctl -k), not
# onto the console.
# The regulatory domain (default_ccode) is NOT set here: h713-wifi sets it
# on load from country= in /etc/h713/wifi.env.
options aic8800_fdrv aicwf_dbg_level=0x1

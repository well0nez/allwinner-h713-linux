# aic8800_fdrv redet im Auslieferungszustand viel zu viel: aicwf_dbg_level ist
# ab Werk 0x40F (ERROR|INFO|DEBUG|TRACE|FW) und flutet unter Last die serielle
# Konsole mit rwnx_send_msg/rwnx_fill_station_info-Zeilen (cstengers Befund,
# mainline/tools/rootfs/customize.sh). Nur Fehler. Bleibt ein Laufzeitknopf:
#   echo 0x403 > /sys/module/aic8800_fdrv/parameters/aicwf_dbg_level
# holt auch die Firmware-Meldungen ins Kernel-Log (journalctl -k), nicht auf
# die Konsole.
# Die Regulierungsdomaene (default_ccode) steht NICHT hier: die setzt h713-wifi
# beim Laden aus country= in /etc/h713/wifi.env.
options aic8800_fdrv aicwf_dbg_level=0x1

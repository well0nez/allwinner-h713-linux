# h713_drm, the clean display stack's driver (docs/subsystems/display-stacks.md). Read only on a clean boot: the vendor
# boot's command line refuses the module (module_blacklist=h713_drm), and h713-display.service loads it, after
# sun50i-h713-arisc, only where the command line says h713.display=clean.
#
# The owner's display files are read where U-Boot reads them, /boot/mips (hy310-boot), through the symlink
# /lib/firmware/h713-mips -> /boot/mips; /lib/firmware/h713/ is the installer's alone. The EDID is the installer's
# /lib/firmware/hy310-edid.bin, served on the HY320's HDMI socket, the provider's port 1. The capture ring is the no-map
# region mips-firmware@4b100000, which no display.bin uses on this stack. gamma_fw and logo_project are project 0x30's
# (the HY320's and the HY310's). restore_logo: an rmmod puts the boot logo back instead of a black panel.
# bench=1 (no device tree node allwinner,sun50i-h713-display-engine) is h713-display load's to give, not this file's.
options h713_drm fw=h713-mips/database.TSE pq_fw=h713-mips/pq_custom.TSE gamma_fw=h713-mips/ProjectID_0x0030.TSE logo_fw=h713-mips/LogoRegData.bin logo_project=0x30 edid_fw=hy310-edid.bin hdmi_port=1 ring_base=0x4b100000 restore_logo=1

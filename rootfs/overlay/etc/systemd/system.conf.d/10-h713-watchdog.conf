# The SoC watchdog (0x02051000, sunxi_wdt with its real layout) is the net against a hung box: PID 1 feeds it, and a
# kernel that hangs or a reboot that stalls resets the box within 16 s, also with a USB cable in (doku/170, stage W2:
# feeding stopped 16.5 s, sysrq-c 14-16 s, reboot/poweroff 0.6 s). 16 s is sunxi_wdt's maximum. It needs a BL31
# whose reset feeds the running watchdog first (T1); release/check-crust.py refuses an image without one.
[Manager]
RuntimeWatchdogSec=16s
RebootWatchdogSec=16s

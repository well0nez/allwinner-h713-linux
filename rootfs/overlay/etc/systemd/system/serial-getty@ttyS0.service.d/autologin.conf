# Autologin on the serial console - taken over from today's netboot root
# (/srv/h713-rootfs/etc/systemd/system/
# serial-getty@ttyS0.service.d/autologin.conf), so that access does not change
# with the move to the eMMC (doku/107, section 3: "autologin stays as today").
#
# This is also the ONLY built-in way in: the root password is locked and there
# is no SSH key in the image. Whoever wants ssh gets their key put in by the
# installer.
#
# The empty ExecStart line clears the one from the original; without it
# systemd only appends the second one.

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM

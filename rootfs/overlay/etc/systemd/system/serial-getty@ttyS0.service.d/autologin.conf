# Autologin auf der seriellen Konsole -- uebernommen aus dem heutigen
# Netboot-Root (/srv/h713-rootfs/etc/systemd/system/
# serial-getty@ttyS0.service.d/autologin.conf), damit sich der Zugang mit dem
# Umzug auf die eMMC nicht aendert (107 §3: "Autologin bleibt wie heute").
#
# Das ist zugleich der EINZIGE eingebaute Weg herein: das Root-Passwort ist
# gesperrt und es liegt kein SSH-Schluessel im Abbild. Wer per ssh will,
# bekommt seinen Schluessel vom Installer eingespielt.
#
# Die leere ExecStart-Zeile loescht die des Originals; ohne sie haengt systemd
# die zweite nur an.

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM

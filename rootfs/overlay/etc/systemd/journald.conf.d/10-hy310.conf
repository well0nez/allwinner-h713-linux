# 107 §4.1 -- Journal fluechtig.
#
# Der Grund ist nicht der Platz, sondern die eMMC: sie hat unter paralleler
# Last Datenfehler gezeigt (HS400, 200 MHz), danach hingen alle Leser im
# D-Zustand. Jedes vermiedene Schreiben ist gewonnen. Gemessen: 840 MiB
# Journal in drei Wochen Netboot-Root -- ein Vorgeschmack auf das, was ein
# Dauerbetrieb auf die eMMC schreiben wuerde.
#
# Storage=volatile legt das Journal nach /run/log/journal, also tmpfs. Kein
# Sicherungsdienst noetig, kein zweiter Speicherort, nichts, was beim
# Herunterfahren schiefgehen kann.
#
# Wer fuer eine Fehlersuche Logs ueber Neustarts hinweg braucht, schaltet mit
# `hy310-logs persistent` um -- das schreibt dann nach /data/log, nicht in
# das Wurzeldateisystem.

[Journal]
Storage=volatile
RuntimeMaxUse=32M

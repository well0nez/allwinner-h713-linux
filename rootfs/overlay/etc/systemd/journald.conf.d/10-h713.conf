# 1.2a -- persistent journal, capped (supersedes the volatile journal of 107 4.1).
#
# Why it changed: with Storage=volatile every restart took the log with it, so
# the cause of an unexplained second boot (TODO 1.2a) and of the crash boot of
# doku/155 could never be read afterwards.
#
# Why it is safe for the eMMC: the 107 measurement was 840 MiB in three weeks
# on a netboot root, about 40 MiB a day. That is a rate, and a cap does not
# lower a rate; what lowers it is below. At a tenth of that volume the journal
# writes a few GB a year, which is nothing against an eMMC's endurance. The
# HS400 data errors that motivated the volatile journal are a link problem,
# not a wear problem, and a journal is the first place to see them.
#
# The cap: 32 MiB in files of at most 4 MiB, so eight files and the oldest
# one goes first. A boot of this system logs well under 1 MiB, so that keeps
# the last dozens of boots; SystemKeepFree keeps it off a nearly full /.
# debug-level messages are not stored (they are the bulk of the volume); a
# batch of ordinary messages is written every five minutes, anything at
# error or worse straight away, which is what a crash needs.
#
# `h713-logs volatile` goes back to RAM; `h713-logs persistent` is the larger
# troubleshooting variant on /data/log (128 MiB).
#
# The directory /var/log/journal is created by build-rootfs.sh: journald only
# writes to disk if it exists (Storage=persistent creates it itself, the
# directory makes the image say so).

[Journal]
Storage=persistent
SystemMaxUse=32M
SystemMaxFileSize=4M
SystemKeepFree=128M
MaxLevelStore=info
SyncIntervalSec=5min

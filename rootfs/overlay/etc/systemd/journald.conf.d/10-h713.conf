# 107 4.1 -- volatile journal.
#
# The reason is not the space, it is the eMMC: under parallel load it showed
# data errors (HS400, 200 MHz), after which every reader hung in D state.
# Every write it is spared is a write won. Measured: 840 MiB of journal in
# three weeks of netboot root -- a taste of what continuous operation would
# write to this eMMC.
#
# Storage=volatile puts the journal into /run/log/journal, that is tmpfs. No
# backup service needed, no second place to keep it, nothing that can go wrong
# at shutdown.
#
# Whoever needs logs across restarts for a troubleshooting session switches
# with `h713-logs persistent` -- that writes to /data/log, not into the root
# file system.
#
# The file used to be called 10-hy310.conf. The name of one board has no
# business in a file that every board gets; h713-logs removes the old name
# when it switches, because journald reads it after this one.

[Journal]
Storage=volatile
RuntimeMaxUse=32M

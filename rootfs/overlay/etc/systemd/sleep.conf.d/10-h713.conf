# No suspend and no hibernation. An image built with --standby replaces this file with the standby
# version (rootfs/install-projekt.sh 5h, docs/subsystems/standby.md); without crust's standby a suspend
# would fall back to s2idle, which powers the display domains down under the running display MIPS.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no

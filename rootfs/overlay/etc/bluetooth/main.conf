# AIC8800: leave radio time for 2.4 GHz WLAN during LE searches.
# BlueZ units are 0.625 ms: 96/16 gives a 60/10 ms scan cycle.
# Applies to searches, not connection intervals or peripheral latency.
[General]

[LE]
ScanIntervalDiscovery=96
ScanWindowDiscovery=16
ScanIntervalAutoConnect=96
ScanWindowAutoConnect=16
ScanIntervalConnect=96
ScanWindowConnect=16

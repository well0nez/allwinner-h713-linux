# KEY_POWER intentionally omitted pending power/standby policy.
# Seven navigation keys verified on HY300PRO-G-EU; other bindings from stock layout.
# Stock NEC remote, customer code 0xfd02 (normalized address 0x02), vendor/usr/keylayout/
# customer_ir_fd02.kl (kl2csv.py, FB-REMOTE + FB-REMOTEb); rc-core scancode = (address << 8) | command.
[[protocols]]
name = "h713-fd02"
protocol = "nec"
[protocols.scancodes]
0x0202 = "KEY_MUTE"  # VOLUME_MUTE
0x0209 = "KEY_UP"  # DPAD_UP
0x0208 = "KEY_RIGHT"  # DPAD_RIGHT
0x0201 = "KEY_DOWN"  # DPAD_DOWN
0x020a = "KEY_LEFT"  # DPAD_LEFT
0x020b = "KEY_OK"  # DPAD_CENTER
0x021f = "KEY_BACK"  # BACK
0x021e = "KEY_MENU"  # SETTINGS
0x0215 = "KEY_VOLUMEUP"  # VOLUME_UP
0x0211 = "KEY_VOLUMEDOWN"  # VOLUME_DOWN
0x020d = "KEY_HOMEPAGE"  # HOME
0x0245 = "KEY_F3"  # MOUSE
0x0266 = "KEY_BLUETOOTH"  # PRJ_BRC_PAIR
0x0250 = "KEY_F5"  # PRJ_FOCUS_DN
0x0251 = "KEY_F4"  # PRJ_FOCUS_UP

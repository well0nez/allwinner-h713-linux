# Fernzugang nur mit Schluessel. Der Schluessel ist NICHT im Abbild
# (107 §3) -- der Installer legt ihn nach /root/.ssh/authorized_keys, wenn
# der Nutzer einen angibt. Bis dahin ist ssh erreichbar, aber nicht
# benutzbar; herein kommt man ueber die serielle Konsole (Autologin).
#
# Das ist Absicht und der Unterschied zu mainline/tools/rootfs/build.sh, das
# --ssh-key VERLANGT und den Schluessel einbaut: fuer ein Release muss der
# Schluessel vom Nutzer kommen, nicht vom Bauenden.

PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no

# Remote access with a key only. The key is NOT in the image
# (doku/107 section 3) - the installer puts it into /root/.ssh/authorized_keys
# if the user gives one. Until then ssh is reachable but not usable; you get
# in over the serial console (autologin).
#
# This is deliberate and the difference to cstenger's rootfs build (tools/rootfs/build.sh
# in his repository at 8860991), which REQUIRES --ssh-key and builds the key in: for a release the key has
# to come from the user, not from the builder.

PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no

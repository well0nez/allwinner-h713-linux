# /etc/h713/tv.conf -- Einstellungen des Dienstes h713-tv (HDMI-Eingang auf
# der Video-Plane). Gelesen einmal beim Start des Dienstes; danach
# `systemctl restart h713-tv@video1`.
#
# NICHT zu verwechseln mit /etc/hy310/tvconfig/ -- das ist das Verzeichnis
# der PQ-Dateien aus dem Geraet des Nutzers (doku/107 Abschnitt 8).
#
# Format: eine Einstellung je Zeile, "schluessel = wert", # leitet einen
# Kommentar ein. Unbekannte Schluessel und Werte werden im Journal genannt und
# ignoriert. Fehlt die Datei ganz, gilt start = auto und der Modus wird in
# /var/lib/h713-tv/modus gemerkt.

# start -- womit der Dienst hochkommt:
#   auto      das Bild folgt dem Signal: liegt HDMI an, wird es gezeigt,
#             sonst die Konsole (das Verhalten vor dieser Datei)
#   manuell   die Konsole, bis jemand `h713-tv ctl on` (oder `auto`) sagt;
#             ab dann folgt das Bild dem Signal, bis `h713-tv ctl off`
#   zuletzt   der Modus, der zuletzt per `h713-tv ctl auto|on|off` gesetzt
#             wurde -- wie ein Fernseher, der seinen Eingang behaelt.
#             Ist noch nichts gemerkt: auto
start = zuletzt

# zustand -- wo der zuletzt gesetzte Modus liegt (ein Wort, auto oder off).
# Geschrieben wird nur, wenn er sich aendert. /var/lib, weil das Zustand ist
# und keine Konfiguration; das Journal ist auf diesem Geraet fluechtig.
# "none" schaltet das Merken ab.
#zustand = /var/lib/h713-tv/modus

# preset -- mit welcher Bildvoreinstellung der Dienst hochkommt (11.09.):
#   NAME     standard cinema vivid game computer hdr -- und, sobald die
#            Herstellerdaten in /etc/hy310/tvconfig liegen, zusaetzlich
#            energy_saving und custom. Was gerade moeglich ist, sagt
#            `h713-tv ctl help`
#   zuletzt  das Preset, das zuletzt mit `h713-tv ctl save` gemerkt wurde
# Gemerkt wird ausdruecklich, nicht bei jeder Reglerbewegung: `ctl save`
# schreibt die neun Regler, das Preset und aspect nach
# /var/lib/h713-tv/werte, `ctl save --aus` loescht das wieder.
preset = zuletzt

# daten -- Verzeichnis der aus dem Geraet des Nutzers entpackten PQ-Dateien.
# Daraus rechnet h713-pq beim Start die neun Reglerwerte und die Gammakurve.
# "none" schaltet das ab: dann gilt die in h713-tv einkompilierte Tabelle.
#daten = /etc/hy310/tvconfig

# rechner -- das Programm, das rechnet. "none" schaltet die Laufzeitrechnung
# ab. Fehlt es, stuerzt es ab oder braucht es laenger als zwei Sekunden, sagt
# das Journal es und die einkompilierte Tabelle gilt -- ein Geraet ohne
# Extraktion zeigt trotzdem ein Bild.
#rechner = /usr/local/bin/h713-pq

# /etc/h713/tv.conf -- settings of the h713-tv service (the HDMI input on the
# video plane). Read once when the service starts; after a change say
# `systemctl restart h713-tv@video1`.
#
# NOT to be confused with /etc/h713/tvconfig/ -- that is the directory of the
# PQ files out of the user's own device (doku/107 section 8).
#
# Format: one setting per line, "key = value", # starts a comment. Unknown
# keys and values are named in the journal and ignored. Without the file
# altogether, start = auto applies and the mode is kept in
# /var/lib/h713-tv/modus.

# start -- what the service comes up with:
#   auto      the picture follows the signal: when HDMI is there it is shown,
#             otherwise the console (the behaviour before this file)
#   manual    the console, until somebody says `h713-tv ctl on` (or `auto`);
#             from then on the picture follows the signal, until
#             `h713-tv ctl off`
#   last      the mode that was last set with `h713-tv ctl auto|on|off` --
#             like a television that keeps its input.
#             With nothing kept yet: auto
# The German words of the releases before this one, "manuell" and "zuletzt",
# still mean exactly the same and are still accepted without a warning.
start = last

# zustand -- where the mode last set is kept (one word, auto or off). It is
# written only when it changes. /var/lib, because this is state and not
# configuration; the journal is volatile on this device.
# "none" switches the keeping off.
#zustand = /var/lib/h713-tv/modus

# preset -- which picture preset the service comes up with (11.09.):
#   NAME     standard cinema vivid game computer hdr -- and, as soon as the
#            vendor data is in /etc/h713/tvconfig, energy_saving and custom
#            as well. What is possible right now is what `h713-tv ctl help`
#            says
#   last     the preset that was last kept with `h713-tv ctl save`
# Keeping is deliberate, not a side effect of every slider movement:
# `ctl save` writes the nine sliders, the preset and aspect to
# /var/lib/h713-tv/werte, `ctl save off` deletes that again.
preset = last

# daten -- directory of the PQ files unpacked out of the user's own device.
# From it h713-pq computes the nine slider values and the gamma curve at the
# start. "none" switches that off: the table compiled into h713-tv applies
# then.
#daten = /etc/h713/tvconfig

# rechner -- the program that computes. "none" switches the run-time
# computation off. When it is missing, crashes or takes longer than two
# seconds, the journal says so and the compiled-in table applies -- a device
# without the extraction still shows a picture.
#rechner = /usr/local/bin/h713-pq

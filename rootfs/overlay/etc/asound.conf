# H713 Linux: names for the two playback paths. "default" is not set here on
# purpose: it lives in /usr/share/alsa/cards/H713-MSP.conf, which alsa-lib loads
# only while the MSP card is present, so a board without it keeps alsa-lib's own
# default (plughw:0, the codec); a pcm.!default here would override that on
# every board (measured against alsa-lib 1.2.11, 27.09.2026).
pcm.bridge {
	type plug
	slave.pcm { type hw card "hy310hdmi" device 0 }
	hint.description "The bridge PCM hw:hy310hdmi,0: device sounds mixed into HDMI by the DSP"
}
pcm.codec {
	type plug
	slave.pcm { type hw card "H713AudioCodec" device 0 }
	hint.description "The codec's own PCM hw:H713AudioCodec,0: heard only with DAC Source = APB"
}

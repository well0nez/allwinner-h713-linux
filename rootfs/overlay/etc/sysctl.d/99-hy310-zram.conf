# doku/107, section 4.2 - the two knobs without which zram swap is not used.
#
# vm.swappiness=180: the value zram swap is generally run with today. It is
# clearly larger than the default of 60 because swapping out here does not go
# to a disk but into compressed RAM - what is expensive is CPU time, not I/O.
# Since Linux 5.8 swappiness may go up to 200.
#
# vm.page-cluster=0: no readahead bundles when swapping in. With a real disk
# one access fetches eight pages at once; with zram every page costs a
# decompression of its own, so the bundle is pure work for nothing.

vm.swappiness = 180
vm.page-cluster = 0

# 107 §4.2 -- die zwei Stellschrauben, ohne die zram-Swap nicht benutzt wird.
#
# vm.swappiness=180: der Wert, mit dem zram-Swap heute allgemein gefahren
# wird. Er ist deutlich groesser als die 60 der Vorgabe, weil das Auslagern
# hier nicht auf eine Platte geht, sondern in komprimierten RAM -- teuer ist
# CPU-Zeit, nicht I/O. Seit Linux 5.8 darf swappiness bis 200.
#
# vm.page-cluster=0: keine Readahead-Buendel beim Einlagern. Bei einer echten
# Platte holt man mit einem Zugriff gleich acht Seiten; bei zram kostet jede
# Seite einzeln eine Dekompression, das Buendel ist reine Arbeit fuer nichts.

vm.swappiness = 180
vm.page-cluster = 0

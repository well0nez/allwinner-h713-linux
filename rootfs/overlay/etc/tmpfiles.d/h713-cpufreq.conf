# The CPU clock may change at most every 20 ms (TODO 2.47, doku/196).
#
# schedutil may change the frequency every rate_limit_us; the kernel derives that from the declared
# transition latency (308 us here: the PWM regulator vdd-cpu ramps at 2.5 mV/us, then the PLL relocks),
# which gave 462 us. Under the 60 Hz load of the warp the four A53 then swung between 480 and 1296 MHz
# all the time, and the sugov:0 thread that carries out every change cost as much CPU as the warp itself.
# Measured on the HY300PRO-G-EU on 11.10.2026, 20 s each, warp on, the same picture:
#   rate_limit_us   warp    sugov:0   all four cores busy
#   462 (kernel)    8.3 %   9.2 %     5.7 %
#   10000           6.0 %   3.6 %     3.5 %
#   20000           5.3 %   2.2 %     2.9 %
# 20 ms halves the load; a burst still raises the clock within a frame and a bit.
w /sys/devices/system/cpu/cpufreq/schedutil/rate_limit_us - - - - 20000

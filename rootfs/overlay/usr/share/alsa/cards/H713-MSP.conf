# proposal (deep review): stock default.conf with the default CARD changed to the MSP card,
# so default:CARD=x, sysdefault:CARD=x and ALSA_CARD keep working while the MSP card is present
pcm.!default {
	@args [ CARD ]
	@args.CARD {
		type string
		default {
			@func getenv
			vars [ ALSA_PCM_CARD ALSA_CARD ]
			default "hy310hdmi"
		}
	}
	type empty
	slave.pcm {
		@func refer
		name {
			@func concat
			strings [ "cards." { @func card_inum card $CARD } ".pcm.default:CARD=" $CARD ]
		}
		default {
			type plug
			slave.pcm { type hw card $CARD device 0 }
			hint.device 0
		}
	}
	hint.description "Device sounds, mixed into HDMI by the DSP (plug over hw:hy310hdmi,0)"
}

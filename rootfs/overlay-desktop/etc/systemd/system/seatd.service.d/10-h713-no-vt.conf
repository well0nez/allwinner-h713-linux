# seatd hands out the input devices to cage and labwc and leaves the VT alone (profile desktop).
#
# Bound to a VT (seatd's default), seatd switches tty1 to graphics mode when a compositor opens the seat and back to
# text mode when the last one closes it. The fbdev emulation of the kernel answers a switch to text mode with a forced
# modeset that ignores the DRM master (drm_fb_helper_set_par(), FB_ACTIVATE_KD_TEXT, the case kept for Xorg): it lays
# the console's framebuffer on the primary plane and switches the video plane off - under h713-tv, which holds the
# master and shows the compositor's picture through h713-warp. With an overlay shown the primary plane sits above the
# video, so every change from one client to the next (Kodi -> desktop, desktop -> browser, ...) left the console on
# the wall.
#
# The projector has no VT switching: the panel belongs to h713-tv, and the compositors draw into h713-warp's Wayland
# server, not onto a VT. seatd 0.9.1 reads SEATD_VTBOUND (seatd(8): "If set to "0", the seat will not be bound to a
# VT"); unbound, it never touches tty1. h713-tv keeps the console's keyboard off while a picture is up, which seatd did
# while a compositor had the seat.
[Service]
Environment=SEATD_VTBOUND=0

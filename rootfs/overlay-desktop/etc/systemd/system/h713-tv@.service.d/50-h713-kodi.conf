# h713-tv@<node> and Kodi share the panel, one at a time (profile desktop; media side project, package F-opt, O5).
# Starting either stops the other; After= puts the stop before the start. The reverse direction (Kodi starting
# stops this instance) comes from the same line: systemd records it on h713-kodi.service as ConflictedBy=.
[Unit]
Conflicts=h713-kodi.service
After=h713-kodi.service

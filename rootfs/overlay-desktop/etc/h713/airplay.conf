# /etc/h713/airplay.conf - AirPlay screen mirroring (h713-airplay, docs/tools/h713-airplay.md): key = value, # starts a comment.
# Every key is here with its default, commented out. The receiver reads the file at its start (`systemctl restart h713-airplay`
# after a change), the presenter at every stream. A line it does not understand is a warning in the journal; the other lines count.

# What an iPhone lists under Screen Mirroring: 1 to 63 characters. Default: the host name in capitals (HY320), else H713.
#name = HY320

# The RTSP port (TCP), 1024..65000. The mirror stream is port + 100 (TCP 7100), the clock port + 11 (UDP 7011); screen audio
# always on UDP 6000 and 6001.
#port = 7000

# The display the receiver offers; a sender scales its screen into it. width 640..3840, height 480..2160, fps 24..60.
#width = 1920
#height = 1080
#fps = 60

# H.265 besides H.264, on or off: iOS 27 sends nothing usable without it.
#hevc = on

# Screen audio, on or off, and the presenter's ALSA device: `default` is the DSP bridge (S16, 48 kHz).
#audio = on
#audio_device = default

# A second sender while one streams takes over (Apple TV's way), on or off; off: it is refused (409 Conflict).
#takeover = on

# The network interfaces the receiver answers on, separated by spaces; empty: every interface that is up and has an address.
#interfaces =

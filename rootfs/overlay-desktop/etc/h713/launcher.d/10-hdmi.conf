# Launcher entry: the HDMI input (media side project, package H; read by h713-keys when Home is pressed, docs/tools/h713-keys.md).
# One file per entry, the file name sorts them. No mode unit runs: the panel shows the picture of the HDMI port.
label = HDMI input
icon = hdmi
# what OK does: end every mode unit (Kodi quits cleanly; the ring comes back by itself, h713-tv `source auto`)
exec = /usr/local/sbin/h713-mode hdmi
# the header while this is what runs: "20:47 . HDMI 1080p60" ({signal} is h713-tv's signal)
now = HDMI {signal}
# this entry is the current one when no other entry's `active` check succeeds, and the selection starts here
fallback = yes

# Launcher entry: Screen Mirroring - AirPlay from an iPhone, iPad or Mac (docs/tools/h713-airplay.md; read by h713-keys,
# docs/tools/h713-keys.md). It has both `unit` and `exec` (05.11.2026): the launcher never starts the unit - systemd does, when a
# phone sets up a stream (h713-airplay-show.socket) - but it is this entry's mode, as Kodi's unit is Kodi's. OK runs `exec` while the
# unit is down: the waiting page, a transient unit as Settings' (its journal lines are kept, a second OK cannot start a second page),
# with --wait, so that `return` reads its exit status: 0 is Back, and the launcher opens again with Screen Mirroring chosen; 16 a
# stream took the wall, 10 Home, 11 Power, 14 h713-osd gone, 15 a signal leave the wall as it is. While the unit is up, OK only closes
# the launcher: the stream is on the wall. on_start does not take this entry.
label  = Screen Mirroring
icon   = airplay
# the mode: h713-mode ends it, h713-keys watches it, the header follows it
unit   = h713-airplay-show.service
exec   = /usr/bin/systemd-run --quiet --collect --wait --unit=h713-airplay-page /usr/local/bin/h713-airplay page
return = launcher
active = /usr/bin/systemctl is-active --quiet h713-airplay-show.service
now    = AirPlay

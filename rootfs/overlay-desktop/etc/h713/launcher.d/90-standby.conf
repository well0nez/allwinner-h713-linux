# Launcher entry: Standby, set apart at the foot of the list. It only exists where a standby can happen.
label = Standby
icon = power
# any way into the sleep ends the same way: h713-sleep-pre/-post (h713-mode) bring the picture and the mode back
exec = /usr/bin/systemctl suspend
show = /usr/local/sbin/h713-power can-standby
group = end

# Launcher entry: Kodi, a mode unit. `unit` starts it with systemctl (no wait); h713-mode ends it before a sleep
# and starts it again after (it reads the `unit` lines of these files).
label = Kodi
icon = film
unit = h713-kodi.service
active = /usr/bin/systemctl is-active --quiet h713-kodi.service
now = Kodi
# `wait`: the page stays, "Starting Kodi...", until this command exits 0 and the unit is up - Kodi answers its JSON-RPC once its
# home screen is there (h713-kodi-switch ready). Without `wait` the page closes at the OK.
wait = /usr/local/sbin/h713-kodi-switch ready

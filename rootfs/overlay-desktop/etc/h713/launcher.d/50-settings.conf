# Launcher entry: Settings (media side project, package S; read by h713-keys when Home is pressed, docs/tools/h713-keys.md).
# The page is a program of its own, not a mode: it draws through h713-osd's page channel and holds the remote while it is open
# (docs/tools/h713-settings.md). It runs as a transient unit so that its journal lines are kept and a second OK cannot start
# a second page (the unit name is taken); h713-mode neither ends it before a sleep nor starts it after.
# --wait: systemd-run stays until the page is gone and ends with the page's exit status, which `return` reads: 0 is Back at the top,
# and the launcher opens again with Settings chosen; Home, Power, idle and the rest (10 and up) leave the wall to the mode below.
label = Settings
icon = sliders
exec = /usr/bin/systemd-run --quiet --collect --wait --unit=h713-settings /usr/local/bin/h713-settings
return = launcher

# Launcher entry: Desktop, a mode unit (the format is that of 20-kodi.conf). `unit` starts it
# with systemctl; h713-mode ends it before a sleep and starts it again after.
label = Desktop
icon = desk
unit = h713-desktop.service
active = /usr/bin/systemctl is-active --quiet h713-desktop.service
now = Desktop
# the page stays, "Starting Desktop...", until the first window is on the wall (labwc/rc.xml touches this file when it is mapped)
wait = /usr/bin/test -e /run/h713-desktop/mapped

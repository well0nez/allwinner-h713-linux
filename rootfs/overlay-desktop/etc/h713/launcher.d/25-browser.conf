# Launcher entry: Browser, a mode unit (the format is that of 20-kodi.conf). `unit` starts it
# with systemctl; h713-mode ends it before a sleep and starts it again after.
label = Browser
icon = globe
unit = h713-browser.service
active = /usr/bin/systemctl is-active --quiet h713-browser.service
now = Browser
# the page stays, "Starting Browser...", until Firefox has a window on the wall: labwc-browser/rc.xml touches this file when a window is
# first mapped (the unit's runtime directory goes with the unit); Firefox needs 9 to 13 s for it (acceptance of 16.10.2026, F4)
wait = /usr/bin/test -e /run/h713-browser/mapped

# /etc/xdg/foot/foot.ini - foot, the desktop's terminal (profile desktop; media side project, package H2).
# A wall seen from a distance: larger text than foot's size 8, a little padding.
[main]
font=monospace:size=14
pad=8x8
# The account h713-desktop has no login shell (sysusers: /usr/sbin/nologin), foot's default is the account's shell, and the window
# would close at once on an empty black desktop (measured 15.10.2026). A terminal that works needs a shell by name.
shell=/bin/bash

# /etc/xdg/foot/foot.ini - foot, the desktop's terminal (profile desktop).
# A wall seen from three metres, like the rest of a TV interface (Firefox runs at twice its size, user.js): 24 pt is a 32 px letter on the
# 1080p wall, about 90 columns by 24 lines (it was 14 pt, 18 px: "hardly readable", Marco 16.10.2026).
[main]
font=monospace:size=24
pad=16x16
# The account h713-desktop has no login shell (sysusers: /usr/sbin/nologin), foot's default is the account's shell, and the window
# would close at once on an empty black desktop (measured 15.10.2026). A terminal that works needs a shell by name.
shell=/bin/bash

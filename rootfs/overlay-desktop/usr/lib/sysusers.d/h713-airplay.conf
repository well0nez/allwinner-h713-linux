# The user of h713-airplay.service and h713-airplay-show.service (profile desktop): the AirPlay receiver and its presenter do not
# run as root. A system user with its own group, which may connect to the presenter's socket (h713-airplay-show.socket,
# SocketGroup=); the home is the receiver's StateDirectory (its key pair and device id), the devices come from the presenter's
# SupplementaryGroups=. systemd-sysusers makes it on the first boot of an image, and by hand on a device that has the units already
# (`systemd-sysusers /usr/lib/sysusers.d/h713-airplay.conf`).
u h713-airplay - "AirPlay receiver and presenter" /var/lib/h713-airplay /usr/sbin/nologin

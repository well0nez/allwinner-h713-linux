# The user of h713-desktop.service and h713-browser.service (profile desktop): labwc, foot and Firefox do not
# run as root. One system user for both modes (one runs at a time, and the browser mode and the desktop's Firefox window share the
# profile); its home is the units' StateDirectory, the devices come from their SupplementaryGroups=. systemd-sysusers makes it on the first
# boot of an image, and by hand on a device that has the units already (`systemd-sysusers /usr/lib/sysusers.d/h713-desktop.conf`).
u h713-desktop - "labwc desktop and Firefox" /var/lib/h713-desktop /usr/sbin/nologin

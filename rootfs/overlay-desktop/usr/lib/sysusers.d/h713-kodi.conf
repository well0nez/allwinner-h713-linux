# The user of h713-kodi.service (profile desktop): cage and Kodi do not run as root. A system user with its own group; the
# home is the unit's StateDirectory, the devices come from the unit's SupplementaryGroups=. systemd-sysusers makes it on the
# first boot of an image, and by hand on a device that has the unit already (`systemd-sysusers h713-kodi.conf`).
u h713-kodi - "Kodi under cage" /var/lib/h713-kodi /usr/sbin/nologin

# h713-media-env.conf - building block for system units that must see the VA-API wiring: cage, Kodi, mpv under a unit of ours.
#
# systemd's user manager reads /etc/environment.d, login shells read /etc/profile.d/h713-media.sh, a SYSTEM unit reads neither.
# This drop-in gives it the same variables from the same file, so there is one place to edit:
#
#   install -d /etc/systemd/system/<unit>.service.d
#   ln -s /usr/local/share/h713/systemd/h713-media-env.conf /etc/systemd/system/<unit>.service.d/10-h713-media-env.conf
#
# (or copy these two lines into the unit's own [Service] section). The leading "-" makes a missing file harmless on an image
# that has the unit but not the VA driver. EnvironmentFile= takes plain KEY=VALUE lines only, which is what
# /etc/environment.d/h713-media.conf is (build-rootfs.sh checks that).
[Service]
EnvironmentFile=-/etc/environment.d/h713-media.conf

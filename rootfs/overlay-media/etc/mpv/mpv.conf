# /etc/mpv/mpv.conf - system-wide defaults of Debian's mpv on the media profile.
# The decoders are the board's: VP9, H.264, HEVC, MPEG-2, VP8 on cedrus, reached through VA-API (megi's
# libva_v4l2_request); the AV1 core is switched off in the kernel at present (patch 0310), so libva offers no AV1
# profile and mpv decodes AV1 in software. LIBVA_DRIVER_NAME and LIBVA_DRIVERS_PATH come from
# /etc/environment.d/h713-media.conf. Nothing here about audio: PipeWire is not started by itself on this image
# (packages-media.txt); a player that wants it starts it first. mpv needs a compositor (cage) for the GL window anyway.
#
# The cheap settings follow cstenger's measurements on this SoC (knowledge, not his files): the GPU is a Mali-G31 and
# the video is 1080p at best, so mpv's own built-in "fast" profile (in 0.40: scale and dscale bilinear, no dithering),
# and a 10 bit framebuffer instead of the half-float one mpv would pick (half the bandwidth; he measured about 40 % GPU
# for 10 bit AV1 at 1080p with it). hwdec-codecs=all because mpv's default list leaves out MPEG-2.
profile=fast
vo=gpu
hwdec=vaapi
hwdec-codecs=all
fbo-format=rgb10_a2

# 10 bit AV1, for when the AV1 core is switched on again (patches 0300-0307 are in the series, 0310 turns the
# decoder off; without it this profile changes nothing, there is no AV1 hardware path to feed). The AV1 core writes
# 10 bits in the low bits of each 16-bit word (kernel format PL10). With
# V4L2_REQUEST_LSB10_LINEAR=1 in the environment the driver exports that as linear P010 for GL; GL reads the
# words as 16-bit values, so the picture is 64 times too dark until this shader multiplies it back:
#     V4L2_REQUEST_LSB10_LINEAR=1 mpv --profile=av1-10bit clip.mkv
# Both together or neither (HEVC Main10 on cedrus arrives as 8-bit NV12 and needs neither).
[av1-10bit]
glsl-shaders=/usr/local/share/h713/mpv/lsb10-x64.glsl

# 50-h713.conf - WirePlumber 0.5 on the H713 (profile media; media side project, package D, M2 Auflage 2).
#
# 1. The default sink is the DSP bridge, not the codec. WirePlumber creates two sinks, the codec's own PCM
#    (alsa_output.platform-2030000.codec.*) and the bridge hw:hy310hdmi,0 (alsa_output.platform-6144000.audio-dsp.*),
#    both with priority.session 1000, and took the codec - which is silent while `DAC Source` = I2S, the normal state
#    (D6, 14.10.2026). The DSP mixes the bridge into HDMI itself (docs/subsystems/audio.md). The node names end in the
#    card profile (".stereo-fallback"), hence the pattern. A default chosen by hand (wpctl set-default, kept in
#    ~/.local/state/wireplumber/default-nodes) still wins over this.
# 2. No video monitors. WirePlumber's V4L2 monitor opens the video devices (hdmirx, cedrus, the USB camera) and logged
#    `impl_node_enum_params() error: Broken pipe` (D6); h713-tv and the decoders own those devices, PipeWire plays sound only.

wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-6144000.audio-dsp.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver = 2000
      }
    }
  }
]

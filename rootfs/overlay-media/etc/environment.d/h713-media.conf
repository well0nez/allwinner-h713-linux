# h713-media.conf - how the players find the hardware decoders (profile media; media side project, package D).
#
# Debian's libva would look for a driver named after the DRM driver of the render node, which is panfrost's
# (the GPU), and find none: the decoders are cedrus and the AV1 core, reached through megi's libva-v4l2_request
# (rootfs/libva/build-libva.sh), which lives in /usr/local/lib/dri.
#
# One file, three readers: systemd's user manager reads it as environment.d; login shells (ssh, the serial console)
# read it through /etc/profile.d/h713-media.sh; a system unit (cage, Kodi, mpv under a unit of ours) has to name it
# itself: EnvironmentFile=/etc/environment.d/h713-media.conf. Plain KEY=VALUE lines, nothing else, so all three agree.
#
# NOT here on purpose: V4L2_REQUEST_LSB10_LINEAR (10 bit AV1 exported as linear P010 for GL; a client that sets it
# without the x64 shader shows a picture 64 times too dark - see /etc/mpv/mpv.conf, profile av1-10bit), and
# V4L2_REQUEST_SCALE / V4L2_REQUEST_CROP (the decode-time scaler, per client and per clip).
LIBVA_DRIVER_NAME=v4l2_request
LIBVA_DRIVERS_PATH=/usr/local/lib/dri
GST_VA_ALL_DRIVERS=1

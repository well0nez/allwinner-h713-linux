# h713-power: what the power key does on an image that offers standby (docs/subsystems/standby.md).
# Read at every press; no restart needed.
#
# short = poweroff | standby - a short press. poweroff: where crust can (h713-power status names it), the
# rails go off, about 0.3 W, and the key or the remote wakes into a fresh boot of about 30 s; else the power-on
# gate. standby: about 2.4 W, the picture back about 5 s after the wake; only when /sys/power/mem_sleep offers
# [deep] and crust reports ready=1, otherwise a short press powers off. Change it with
#   h713-power set short standby        (or poweroff)
short = poweroff
# a press this long (seconds) powers off, whatever short says
long_s = 3
# a KEY_POWER this soon (seconds) after a resume the key itself woke is that same press and is ignored;
# provisional until the device stage K has measured the window
ignore_s = 2
# remote = on | off - the Bluetooth remote's power key follows the same rules, or does nothing at all
# (off: logind is locked out of it too while this service runs)
remote = on
# refused = poweroff | log - a short press whose standby the kernel refused: power off, or stay on and log
refused = poweroff

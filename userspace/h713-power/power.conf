# h713-power: what the power key does (docs/tools/h713-power.md, docs/subsystems/standby.md).
# Read at every press; no restart needed.
#
# default = poweroff | standby - what a short press counts down to (TODO 2.38): the projector shows 15 s in the
# middle of the picture, standby on the left, off on the right; Left/Right on the remote choose, OK or a second
# press acts at once, Back cancels, and when the time is up this choice is carried out. Without a picture the
# default happens at once. poweroff: the power-on gate under the vendor's ARISC firmware, what an image runs;
# where crust runs and can (h713-arisc set crust, experimental; h713-power status names it), the rails go off,
# about 0.3 W, and the key or the remote wakes into a fresh boot of about 30 s. standby: about 2.0-2.4 W, the
# picture back about 5 s after the wake; offered only on an image built with --standby whose kernel offers
# [deep] and whose crust reports ready=1. `short`, the name before the countdown, means the same.
#   h713-power set default standby        (or poweroff)
default = poweroff
# a press this long (seconds) powers off, whatever short says
long_s = 3
# a KEY_POWER this soon (seconds) after a resume the key itself woke is that same press and is ignored;
# provisional until the device stage K has measured the window
ignore_s = 2
# remote = on | off - the Bluetooth remote's power key follows the same rules, or does nothing at all
# (off: logind is locked out of it too while this service runs)
remote = on
# refused = poweroff | log - a short press whose standby the kernel refused: power off, or stay on and log.
# A standby a wake-up aborted (a second press while it goes to sleep) is no refusal: the projector stays on.
refused = poweroff

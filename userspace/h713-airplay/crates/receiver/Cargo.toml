# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "h713-airplay-receiver"
description = "The AirPlay mirroring receiver: mDNS, RTSP, pairing, fp-setup, the mirror and audio streams, NTP, the control socket, the stream to the presenter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "receiver"

[dependencies]
proto = { package = "h713-airplay-proto", path = "../proto" }
fairplay = { package = "h713-airplay-fairplay", path = "../fairplay" }
# The mDNS responder of its own (no avahi on the device): _airplay._tcp and _raop._tcp.
mdns-sd = { version = "0.21", default-features = false }
if-addrs = "0.15"
plist = { version = "1", default-features = false }
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
getrandom = { version = "0.2", features = ["std"] }
libc = "0.2"

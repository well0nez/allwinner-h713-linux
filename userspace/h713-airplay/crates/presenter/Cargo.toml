# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "h713-airplay-presenter"
description = "h713-airplay-show: the mode unit that decodes the mirror stream in hardware and puts it through h713-warp, and plays the sound"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "presenter"

[[bin]]
name = "h713-airplay-show"
path = "src/main.rs"

[dependencies]
proto = { package = "h713-airplay-proto", path = "../proto" }
libc = "0.2"

# The picture and sound path exists for the board only (src/hw, src/sys.rs: bindings for its FFmpeg 7.1, EGL, GLES,
# GBM and ALSA); on the host the crate builds its pure parts and their tests.
[target.'cfg(target_arch = "aarch64")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

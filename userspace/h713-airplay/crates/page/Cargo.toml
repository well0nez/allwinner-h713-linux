# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "h713-airplay-page"
description = "The waiting screen of the launcher's Screen Mirroring entry, drawn through h713-osd's page channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "page"

[dependencies]
proto = { package = "h713-airplay-proto", path = "../proto" }
# the face: Quicksand from the TTF on the box, rasterised in pure Rust (no FreeType in the binary)
ab_glyph = "0.2"
# the canvas: the memfd, SCM_RIGHTS, evdev, inotify, signals
libc = "0.2"
# --render-png only
png = "0.17"

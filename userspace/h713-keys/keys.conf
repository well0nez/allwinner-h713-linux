# /etc/h713/keys.conf - h713-keys, the stock remote's keys (docs/tools/h713-keys.md).
# Read again when it changes; no restart needed.

# The volume step per press of louder/quieter, 1..20 (h713-tv's 0..100 scale).
# Louder and quieter both lift a mute.
volume_step = 5

# The motor steps per press of focus up/down, 1..100 (one step is about 16 ms of
# travel; the sharp range is several hundred steps wide). A held key keeps the
# motor going and stops one move after the release. Presses during a move wait
# for the next one (at most two presses' worth).
focus_steps = 20

# The key(s) that switch between the HDMI picture and the console, by their
# kernel names (KEY_...), separated by spaces; empty = no such key. The stock
# remote has no key left for it yet (TODO 2.46). A key's name and code: press it
# once, journalctl -u h713-keys.
input_keys =

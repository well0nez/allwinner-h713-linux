# /etc/h713/osd.conf - h713-osd, the overlays over the picture (docs/tools/h713-osd.md).
# Read again when it changes; no restart needed.

# Where the overlay sits: bottom (centred above the lower edge, as the stock firmware shows its volume),
# top-right, center. The mute badge sits top right (top left when the overlays are top right).
place = bottom

# pill: a dark translucent panel with round ends behind white lines; bare: the lines with a soft shadow.
look = pill

# The size, 0.5..2 (1 = meant for the panel height; 720p and 1080p panels get the same proportions).
scale = 1.0

# How long an overlay stays after the last key, 0.5..10 seconds. The mute badge stays while muted.
seconds = 2.5
